services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: movelagro
      POSTGRES_USER: movelagro
      POSTGRES_PASSWORD: movelagro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movelagro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://movelagro:movelagro@db/movelagro
    command: >
      sh -c "python seed_data/generate.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
